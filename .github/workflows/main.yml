name: Main

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    name: Build and Test

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '23.x'
          cache: 'npm'

      - name: Build
        run: npm ci

      - name: Test
        run: npm test

  generate-screenshots:
    name: Generate Screenshots
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-os:${{ matrix.os }}-python:3.12-${{ env.pythonLocation }}-${{ hashFiles('setup.py') }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Dependencies
        shell: bash
        run: pip3 install -r requirements-dev.txt

      - name: Start Server in Docker Container
        run: |
          docker run --rm --tty --detach \
            --volume "$(pwd)/site:/autograder-web/site" \
            --publish 127.0.0.1:8080:8080 \
            --name autograder-server-container \
            edulinq/autograder-server-prebuilt:latest \
            server --unit-testing \
            --config web.static.root=/autograder-web/site \
            --log-level=debug

      - name: Generate Image Artifacts
        run: ./scripts/generate_screenshots.py

      - name: DEBUG List Directories
        run: ls -R

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: resources/*.png

      - name: Stop Server Container
        if: always()
        run: docker stop autograder-server-container

  publish-github-pages:
    needs: generate-screenshots

    permissions:
      contents: read
      id-token: write
      packages: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-os:${{ matrix.os }}-python:3.12-${{ env.pythonLocation }}-${{ hashFiles('setup.py') }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Dependencies
        shell: bash
        run: pip3 install -r requirements-dev.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Site
        run: python3 scripts/generate_site.py ${{ github.repository_owner }} ${{ github.repository.name }} ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
